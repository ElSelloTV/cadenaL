# cadenaL — cadena de procesamiento de aire para FM
#
# Se instala en: /etc/pipewire/pipewire.conf.d/99-filter-chain-fm.conf
# (install.sh ya la copia ahí; después de editarla hay que reiniciar:
#   systemctl --user restart pipewire wireplumber)
#
# ANTES DE USAR, completar los 4 placeholders marcados con <...>:
#
#   1. Nombre real del dispositivo de CAPTURA (entrada) de la MVSilicon.
#   2. Nombre real del dispositivo de REPRODUCCION (salida) de la MVSilicon.
#
# Para averiguarlos:
#
#   wpctl status
#
# Buscar la MVSilicon en la lista de "Sources" (para capture.props) y de
# "Sinks" (para playback.props), y usar el nombre largo tipo
# "alsa_input.usb-MV-SILICON_..." / "alsa_output.usb-MV-SILICON_...".
# Si preferís confirmar el nombre ALSA crudo: `aplay -l` / `arecord -l`.
#
# Los URIs de los plugins LV2 (plugin = "...") se pueden listar y
# confirmar con:
#
#   lv2ls | grep -i -E 'calf|lsp'
#
# por si tu version empaquetada difiere de la de acá.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "CadenaL FM"
            media.name        = "CadenaL FM"

            # Cadena fija: Autogain -> Compresor -> EQ 5 bandas ->
            # Stereo Tools (ancho estereo) -> Limitador (siempre ultimo,
            # como barrera final contra picos antes del codificador).
            filter.graph = {
                nodes = [
                    {
                        type   = lv2
                        name   = autogain
                        plugin = "http://lsp-plug.in/plugins/lv2/autogain_stereo"
                        # Valores por defecto del plugin. Ajustar y volcar
                        # acá los definitivos una vez afinado con Carla
                        # (ver seccion "Afinar niveles" del README).
                        control = { }
                    }
                    {
                        type   = lv2
                        name   = compressor
                        plugin = "http://calf.sourceforge.net/plugins/Compressor"
                        control = { }
                    }
                    {
                        type   = lv2
                        name   = eq5
                        plugin = "http://calf.sourceforge.net/plugins/Equalizer5Band"
                        control = { }
                    }
                    {
                        type   = lv2
                        name   = stereo
                        plugin = "http://calf.sourceforge.net/plugins/StereoTools"
                        # Cuidado al subir "width": un ensanchamiento
                        # excesivo genera problemas de fase al sumar L+R
                        # (compatibilidad mono), critico en FM. Arrancar
                        # con el valor por defecto (mono-safe) y subir de
                        # a poco escuchando la suma L+R.
                        control = { }
                    }
                    {
                        type   = lv2
                        name   = limiter
                        plugin = "http://calf.sourceforge.net/plugins/Limiter"
                        control = { }
                    }
                ]
                links = [
                    { output = "autogain:out_l"   input = "compressor:in_l" }
                    { output = "autogain:out_r"   input = "compressor:in_r" }
                    { output = "compressor:out_l" input = "eq5:in_l" }
                    { output = "compressor:out_r" input = "eq5:in_r" }
                    { output = "eq5:out_l"        input = "stereo:in_l" }
                    { output = "eq5:out_r"        input = "stereo:in_r" }
                    { output = "stereo:out_l"     input = "limiter:in_l" }
                    { output = "stereo:out_r"     input = "limiter:in_r" }
                ]
            }

            audio.channels = 2
            audio.position = [ FL FR ]

            capture.props = {
                # <1> Reemplazar por el node.name real de ENTRADA de la
                # MVSilicon (source), obtenido de `wpctl status`.
                node.target    = "<NODE_NAME_ENTRADA_MVSILICON>"
                audio.channels = 2
                audio.position = [ FL FR ]
            }

            playback.props = {
                # <2> Reemplazar por el node.name real de SALIDA de la
                # MVSilicon (sink), obtenido de `wpctl status`.
                node.target    = "<NODE_NAME_SALIDA_MVSILICON>"
                audio.channels = 2
                audio.position = [ FL FR ]
                # node.passive evita que este filtro "despierte" el grafo
                # por si solo; al ser la unica cadena de la maquina no
                # hace falta, se deja explicito para claridad.
                node.passive = false
            }
        }
    }
]
