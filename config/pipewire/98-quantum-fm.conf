# cadenaL — sample rate fijo y tamano de buffer (quantum) para un CPU
# de 2 nucleos / 800-1450MHz sin SMT (AMD Sempron 2650).
#
# Se instala en: /etc/pipewire/pipewire.conf.d/98-quantum-fm.conf
#
# - Frecuencia FIJA (no flotante): evita que PipeWire este resampleando
#   constantemente si algo pide otra tasa; todo el grafo corre a 48kHz.
# - default.clock.min/max.quantum acotan el rango en el que WirePlumber
#   puede mover el buffer; el "quantum" real (default.clock.quantum)
#   arranca en 1024 frames (~21ms a 48kHz), un valor conservador para
#   este CPU. Si `pw-top` muestra xruns sostenidos, subir a 2048; si
#   despues de un dia sin xruns se quiere bajar latencia, probar 512.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 2048
}
