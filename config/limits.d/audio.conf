# cadenaL — limites de tiempo real para el usuario que corre PipeWire.
#
# Se instala en: /etc/security/limits.d/audio.conf
#
# En Debian con rtkit instalado esto normalmente ya se maneja via
# polkit/rtkit de forma dinamica, pero fijarlo explicito acá evita
# depender de que rtkit responda a tiempo en el arranque (importante en
# una maquina que se prende sola tras un corte de luz).
#
# Reemplazar "radio" por el usuario real que corre el servicio
# --user de PipeWire (el que instala pipewire.socket/wireplumber).
@radio   -  rtprio     95
@radio   -  memlock    unlimited
@radio   -  nice       -19
