  <circle cx="10" cy="16" r="3.2" fill="#ffd166"/>
  <circle cx="10" cy="32" r="3.2" fill="#ffd166"/>
  <circle cx="10" cy="48" r="3.2" fill="#ffd166"/>

  <!-- salida unica virtual -->
