[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadenal"
version = "0.1.0"
description = "Enrutador automatico de audio: casa todas las salidas/streams de audio de la maquina en una unica salida virtual."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "pulsectl>=23.5.2",
]

[project.scripts]
cadenal = "cadenal.cli:main"

[tool.setuptools.packages.find]
include = ["cadenal*"]
